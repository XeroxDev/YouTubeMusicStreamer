name: PR Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, x86, arm64 ]
    env:
      OS: win
      APP_NAME: YouTubeMusicStreamer
      DOTNET_VERSION: "9.0"
      ARCH: ${{ matrix.arch }}
      RELEASE_NOTES_FILE: release-notes.md
      VPK_OUTPUT_DIR: Releases
      VPK_PACK_AUTHORS: XeroxDev
      VPK_PACK_TITLE: "YouTube Music Streamer"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build env
        shell: pwsh
        env:
          GITHUB_SHA: ${{ github.sha }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID || 'pr-build' }}
          VERSION_SUFFIX: -ci.${{ github.run_number }}
        run: .\scripts\prepare-build-env.ps1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: Run tests
        run: dotnet test YouTubeMusicStreamer.Tests/YouTubeMusicStreamer.Tests.csproj

      - name: Prepare publish assets
        shell: pwsh
        run: .\scripts\prepare-publish-assets.ps1

      - name: Publish
        run: dotnet publish YouTubeMusicStreamer/YouTubeMusicStreamer.csproj -c Release -p:PublishProfile=${{ env.VPK_CHANNEL }}

      - name: Install VPK tool
        shell: pwsh
        run: dotnet tool install -g vpk

      - name: VPK pack
        shell: pwsh
        run: |
          # assemble the mandatory args
          $args = @(
            '--outputDir';   $Env:VPK_OUTPUT_DIR
            '--channel';     $Env:VPK_CHANNEL
            '--runtime';     $Env:VPK_RUNTIME
            '--packId';      $Env:VPK_PACK_ID
            '--packVersion'; $Env:VPK_PACK_VERSION
            '--packDir';     $Env:VPK_PACK_DIR
            '--packAuthors'; $Env:VPK_PACK_AUTHORS
            '--packTitle';   $Env:VPK_PACK_TITLE
            '--icon';        $Env:VPK_ICON
            '--mainExe';     $Env:VPK_MAIN_EXE
            '--framework';   $Env:VPK_FRAMEWORK
            '--splashImage'; $Env:VPK_SPLASH_IMAGE
          )
          
          # run the pack
          Write-Host "Running: vpk pack $($args -join ' ')"
          vpk pack @args

          # Extract portable zip to avoid zip-in-zip in GitHub Artifacts
          $portableZip = Get-ChildItem -Path "$Env:VPK_OUTPUT_DIR/*-Portable.zip" | Select-Object -First 1
          if ($portableZip) {
            Write-Host "📦 Extracting $($portableZip.Name) for artifact upload..."
            Expand-Archive -Path $portableZip.FullName -DestinationPath "$Env:VPK_OUTPUT_DIR/Portable"
          }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeMusicStreamer-Installer-${{ matrix.arch }}
          path: ${{ env.VPK_OUTPUT_DIR }}/*-Setup.exe

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeMusicStreamer-Portable-${{ matrix.arch }}
          path: ${{ env.VPK_OUTPUT_DIR }}/Portable
